<!DOCTYPE html>
<!-- 존재하지 않는 경로에 정식 404를 반환하기 위한 페이지 (소프트404 방지) -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>페이지를 찾을 수 없습니다 | 배수민 법률사무소</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root { --navy: #1a2e4a; --gold: #b4975a; --cream: #faf8f5; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Pretendard', Roboto, sans-serif;
            background: var(--cream); color: var(--navy);
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 24px;
            word-break: keep-all; line-height: 1.7;
        }
        .code { font-size: 72px; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
        h1 { font-size: 22px; margin: 16px 0 8px; }
        p { color: #666; font-size: 15px; margin-bottom: 28px; }
        a {
            display: inline-block; background: var(--navy); color: #fff;
            text-decoration: none; padding: 12px 28px; border-radius: 8px;
            font-size: 15px; transition: opacity .2s;
        }
        a:hover { opacity: .9; }
    </style>
</head>
<body>
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>요청하신 페이지가 존재하지 않거나 주소가 변경되었습니다.</p>
    <a href="/">홈으로 돌아가기</a>
</body>
</html>
